# ===========================
# LLM Eval Framework Config
# ===========================

dataset:
  input_path: "data/golden/golden_dataset.csv"      # 輸入 CSV 路徑
  output_path: "data/output/result.csv"             # 輸出 CSV 路徑（新檔）
  output_mode: "new"                                # "new" | "overwrite"
  encoding: "utf-8-sig"                                 # CSV 編碼

column_mapping:
  answer_column: "expected_output"                  # 標準答案欄位（不可傳給 primary LLM）

  input_columns:
    merge: false                                    # false: 用第一個欄位；true: 多欄合併
    columns:
      - "input"
      # - "context"
    merge_template: "{question}\n\nContext: {context}"  # merge 為 true 時的 Prompt 樣板

  output_column: "llm_answer"                       # primary LLM 回答欄位

primary_llm:
  base_url: "https://dgx-02-8081.wade0426.me/v1"
  api_key: "test"
  model: "gpt-4o"
  system_prompt: |
    你是一個專業的問答助手，請根據使用者提供的內容與問題給出回答。
  temperature: 0.1
  max_tokens: 16384
  timeout_seconds: 600

execution:
  max_retries: 1                                    # 失敗重試次數（指數退避）
  retry_delay_seconds: 2
  rate_limit_rpm: 999                               # 全局速率限制（Requests Per Minute）
  checkpoint_path: "data/checkpoints/.checkpoint.json"
  batch_log_interval: 10
  max_workers: 2                                    # 並行處理的執行緒數量

judge:
  enabled: false
  base_url: "https://api.openai.com/v1"
  api_key: "test"
  model: "gpt-4o"
  output_column: "judge_score"
  system_prompt: |
    你是一位嚴格的評審。你將收到一個問題、一個標準答案和一個模型回答。
    請評估模型回答的正確性，並以 JSON 格式回覆：
    {"score": 0~1的浮點數, "reason": "評分理由"}
  temperature: 0.0
  max_tokens: 512
  timeout_seconds: 30

conversation_log:                                   # 對話紀錄設定
  enabled: true
  log_path: "data/output/conversation.jsonl"
  log_mode: "append"                                # "append" 或 "latest_only"

image:
  enabled: true                                    # 是否啟用多模態圖片輸入（為 true 時，LLM 需支援 Vision API）
  image_column: "image_path"                        # CSV 中存放圖片路徑的欄位名稱
  base_dir: "./data/golden/images"                  # 圖片的根目錄路徑（會與 CSV 中的路徑拼接）
  detail: "high"                                    # OpenAI Vision detail 參數："auto", "low" 或 "high"
  separator: ";"                                    # 多張圖片的字串分隔符（預設為分號，不可為逗號）
